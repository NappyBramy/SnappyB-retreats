<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>SnappyB Retreats</title>
<style>
:root{--bg1:#f2f4f6;--bg2:#e2e7ea;--bg3:#c7d1d8;--bg4:#9fb1bd;--ink:#26313a;--ink-soft:#5f6d78;--glass-bg:rgba(255,255,255,.62);--glass-bg-strong:rgba(255,255,255,.85);--glass-border:rgba(255,255,255,.8);--glass-shadow:rgba(60,80,95,.14);--accent:#3c6e8f;--green:#2f9e5c;--red:#d1483f;--orange:#e08a2e;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;min-height:100vh;color:var(--ink);
  background:radial-gradient(ellipse at 10% -10%,#fbfcfd,transparent 45%),radial-gradient(ellipse at 100% 10%,var(--bg3),transparent 55%),linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg4) 100%);
  background-attachment:fixed;}
.hdr{background:var(--glass-bg);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);padding:14px 18px;border-bottom:1px solid var(--glass-border);position:sticky;top:0;z-index:10;box-shadow:0 4px 20px var(--glass-shadow)}
.hdr-logo{font-size:1rem;font-weight:700}
.hdr-sub{font-size:.65rem;color:var(--ink-soft);margin-top:2px}
.prog{background:var(--glass-bg);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);padding:16px 16px 12px;border-bottom:1px solid var(--glass-border)}
.prog-steps{display:flex;align-items:flex-start}
.prog-item{display:flex;flex-direction:column;align-items:center;flex:1}
.prog-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;transition:all .3s}
.pc-done{background:var(--green);color:white;box-shadow:0 3px 10px rgba(47,158,92,.35)}
.pc-active{background:var(--accent);color:white;box-shadow:0 3px 10px rgba(60,110,143,.35)}
.pc-pending{background:rgba(95,109,120,.16);color:var(--ink-soft)}
.prog-lbl{font-size:.6rem;font-weight:500;color:var(--ink-soft);margin-top:4px;text-align:center;display:block}
.pl-done{color:var(--green);font-weight:600}
.pl-active{color:var(--accent);font-weight:700}
.prog-line{flex:1;height:2px;background:rgba(95,109,120,.25);margin:13px 3px 0;transition:background .3s}
.pl-line-done{background:var(--green)}
.body{padding:16px;max-width:520px;margin:0 auto;padding-bottom:60px}
.panel{display:none}
.panel.active{display:block}
.lang-bar{display:flex;gap:4px;background:var(--glass-bg);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-radius:16px;padding:4px;margin-bottom:20px;border:1px solid var(--glass-border);box-shadow:0 6px 16px var(--glass-shadow)}
.lang-btn{flex:1;padding:8px 2px;font-size:.68rem;font-weight:500;color:var(--ink-soft);border-radius:12px;border:none;background:transparent;font-family:inherit;cursor:pointer;min-height:36px;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .3s ease,color .3s ease,box-shadow .3s ease}
.lang-btn:active{transform:scale(.88)}
.lang-btn.on{background:var(--glass-bg-strong);color:var(--accent);font-weight:700;box-shadow:0 3px 10px rgba(60,110,143,.25);transform:scale(1.06)}
.welcome{text-align:center;margin-bottom:20px}
.wel-title{font-size:1.2rem;font-weight:700;margin-bottom:4px}
.wel-sub{font-size:.78rem;color:var(--ink-soft);line-height:1.5}
.sec-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px;padding-left:4px}
.prop-row{display:flex;gap:10px;margin-bottom:20px}
.prop-card{flex:1;padding:16px 10px;background:var(--glass-bg);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border-radius:18px;text-align:center;font-size:.8rem;font-weight:500;color:var(--ink-soft);border:2px solid var(--glass-border);cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .3s ease,border-color .3s ease,box-shadow .3s ease;-webkit-tap-highlight-color:transparent;user-select:none;box-shadow:0 8px 20px var(--glass-shadow),inset 0 1.5px 0 rgba(255,255,255,.7)}
.prop-card:active{transform:scale(.95)}
.prop-card.on{border-color:var(--accent);color:var(--accent);background:rgba(60,110,143,.18);font-weight:700;transform:scale(1.03);box-shadow:0 10px 24px rgba(60,110,143,.28),inset 0 1.5px 0 rgba(255,255,255,.85)}
.prop-icon{font-size:1.8rem;margin-bottom:6px}
.fcard{background:var(--glass-bg);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-radius:20px;overflow:hidden;margin-bottom:20px;border:1px solid var(--glass-border);box-shadow:0 8px 22px var(--glass-shadow),inset 0 1.5px 0 rgba(255,255,255,.7)}
.fcard-sec{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);padding:12px 16px 4px}
.frow{display:flex;align-items:center;padding:8px 16px;border-bottom:1px solid var(--glass-border);gap:10px}
.frow:last-child{border-bottom:none}
.flbl{font-size:.82rem;color:var(--ink);font-weight:500;width:108px;flex-shrink:0}
.finput{flex:1;border:1px solid var(--glass-border);border-radius:12px;font-size:.82rem;color:var(--ink);background:rgba(255,255,255,.55);padding:9px 11px;font-family:inherit;outline:none;min-width:0}
.finput:focus{border-color:var(--accent);background:#fff}
.finput::placeholder{color:var(--ink-soft);opacity:.7}
.drow{padding:12px 16px;border-bottom:1px solid var(--glass-border)}
.drow:last-child{border-bottom:none}
.dlbl{font-size:.82rem;color:var(--ink);font-weight:500;margin-bottom:8px}
.dselects{display:flex;gap:7px}
.dsel{flex:1;padding:10px 4px;border:1px solid var(--glass-border);border-radius:12px;font-size:.82rem;color:var(--accent);background:rgba(255,255,255,.55);font-family:inherit;font-weight:600;text-align:center;-webkit-appearance:none;cursor:pointer;min-width:0}
.navrow{display:flex;gap:10px;margin-top:8px}
.btn-back{flex:1;padding:14px;border:1px solid var(--glass-border);border-radius:16px;background:var(--glass-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:.9rem;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:inherit;transition:transform .15s}
.btn-back:active{transform:scale(.97)}
.btn-next{flex:2;padding:14px;border:none;border-radius:16px;background:var(--accent);font-size:.92rem;font-weight:700;color:white;cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(60,110,143,.35);transition:transform .15s}
.btn-next:active{transform:scale(.97)}
.btn-full{width:100%;padding:15px;border:none;border-radius:16px;background:var(--accent);font-size:.92rem;font-weight:700;color:white;cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(60,110,143,.35);transition:transform .15s}
.btn-full:active{transform:scale(.98)}
.sumrow{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--glass-border);font-size:.83rem}
.sumrow:last-child{border-bottom:none}
.sum-k{color:var(--ink-soft)}
.sum-v{color:var(--ink);font-weight:500;text-align:right;max-width:60%}
.sub-col{display:flex;flex-direction:column;gap:12px;margin-top:16px;margin-bottom:14px}
.sbtn{width:100%;padding:16px;border:none;border-radius:18px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;display:block;line-height:1.4;transition:transform .15s}
.sbtn:active{transform:scale(.98)}
.sbtn-wa{background:#25d366;color:white;box-shadow:0 8px 20px rgba(37,211,102,.35)}
.sbtn-bk{background:#003580;color:white;box-shadow:0 8px 20px rgba(0,53,128,.35)}
.priv{font-size:.75rem;color:var(--ink-soft);text-align:center;line-height:1.5;padding:0 10px;opacity:.8}
.verify-warn{background:rgba(224,138,46,.16);border:1px solid rgba(224,138,46,.4);border-radius:16px;padding:12px 16px;margin-top:16px;text-align:center;font-size:.82rem;font-weight:600;color:#9a5a12;line-height:1.5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.err{font-size:.78rem;color:var(--red);background:rgba(209,72,63,.14);border-radius:14px;padding:10px 14px;margin-bottom:12px;display:none}
.err.show{display:block}
.copy-box{display:none;background:rgba(60,110,143,.12);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-radius:18px;padding:16px;margin-top:12px;border:1px solid var(--glass-border);box-shadow:0 8px 22px var(--glass-shadow)}
.copy-ttl{font-size:.72rem;font-weight:700;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.copy-instr{font-size:.82rem;color:var(--ink);white-space:pre-wrap;line-height:1.8;background:rgba(224,138,46,.14);border-left:3px solid var(--orange);border-radius:8px;padding:10px;margin-bottom:10px}
.copy-msg{background:rgba(255,255,255,.85);border:1px solid var(--glass-border);border-radius:14px;padding:12px;font-size:.78rem;line-height:1.6;white-space:pre-wrap;max-height:160px;overflow-y:auto;margin-bottom:10px}
.copy-btn{width:100%;padding:13px;background:var(--accent);color:white;border:none;border-radius:14px;font-family:inherit;font-size:.88rem;font-weight:700;cursor:pointer}
.copy-ok{display:none;text-align:center;color:var(--green);font-size:.82rem;font-weight:600;margin-top:8px}
.sent-btn{display:none;width:100%;padding:13px;background:var(--green);color:white;border:none;border-radius:14px;font-family:inherit;font-size:.88rem;font-weight:700;cursor:pointer;margin-top:8px}
.screen{display:none;text-align:center;padding:50px 16px}
.screen.show{display:block}
.suc-logo{width:140px;height:140px;object-fit:cover;border-radius:22px;margin:0 auto 10px;display:block;box-shadow:0 12px 30px var(--glass-shadow)}
.suc-prop{font-size:.7rem;font-weight:700;color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}
.maps-btn{display:block;padding:13px;background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--ink);border:1px solid var(--glass-border);border-radius:14px;font-size:.85rem;font-weight:600;text-decoration:none;text-align:center;margin:12px 0}
.new-btn{padding:12px 24px;background:var(--glass-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-border);border-radius:16px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--accent);margin-top:8px}
.scr-btns{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn-yes{padding:15px;background:var(--green);color:white;border:none;border-radius:16px;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(47,158,92,.35)}
.btn-no{padding:15px;background:var(--glass-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--accent);border:1px solid var(--glass-border);border-radius:16px;font-size:.92rem;font-weight:600;cursor:pointer;font-family:inherit}
select option:disabled{color:#c7c7cc}
</style>
</head>

    <div class="prog-item"><div class="prog-circle pc-pending" id="pc4">4</div><div class="prog-lbl" id="pl4">Αποστολή</div></div>
  </div>

function updProg(s){
  curStep=s;
  const T=TX[lang]||TX.el;
  [1,2,3,4].forEach(i=>{
    const c=g('pc'+i),lb=g('pl'+i);
    c.className='prog-circle '+(i<s?'pc-done':i===s?'pc-active':'pc-pending');
    c.textContent=i<s?'✓':String(i);

    lb.textContent=T.st[i-1];
  });

function go(n){
  const T=TX[lang]||TX.el;
  if(curStep===1&&n>1){
    if(!prop){showErr('e1',T.err.prop);return;}
    hideErr('e1');
  }
  if(curStep===2&&n>2){
    const nm=g('f-nm').value.trim(),ct=g('f-ct').value.trim(),zp=g('f-zp').value.trim();
    const isEl=lang==='el',idV=isEl?g('f-el').value.trim():g('f-en').value.trim();
    const ph=g('f-ph').value.trim();
    if(!nm||!ct||!zp||!idV||!ph){showErr('e2',T.err.all);return;}
    hideErr('e2');
  }
  if(curStep===3&&n>3){
    const today=new Date().toISOString().slice(0,10);
    if(!ci||!co){showErr('e3',T.err.all);return;}
    if(ci<today){showErr('e3',T.err.past);['ci-d','ci-m','ci-y'].forEach(id=>g(id).selectedIndex=0);ci='';return;}
    if(co<=ci){showErr('e3',T.err.dates);return;}
    hideErr('e3');buildSum();
  }
  [1,2,3,4].forEach(i=>g('s'+i).classList.toggle('active',i===n));
  g('scnf').classList.remove('show');g('ssuc').classList.remove('show');
  g('cbox').style.display='none';g('subcol').style.display='flex';
  g('prog').style.display='block';
  updProg(n);window.scrollTo({top:0,behavior:'smooth'});
}

  const pn=prop==='p'?'Pistacchio by SnappyB':'SnappyB Living Spaces';
  const rows=[[T.prop,pn],[T.nm,g('f-nm').value.trim()],[T.ct,g('f-ct').value.trim()],[T.zp,g('f-zp').value.trim()],[isEl?'ΑΦΜ':T.id,idV],[T.phone,getFullPhone()],['Check-in',ci],['Check-out',co]];
  g('sr').innerHTML=rows.map(([k,v])=>`<div class="sumrow"><span class="sum-k">${k}</span><span class="sum-v">${v}</span></div>`).join('');
}

const PROXY='https://script.google.com/macros/s/AKfycbz24YxkIV4XJImGySmzfg5BQ-Z8C3dlS8vQaUkUa5o2fVDhPUBYhepl8GbDppVFSZsa/exec';

function saveToSheet(){
  const isEl=lang==='el';
  const idV=isEl?g('f-el').value.trim():g('f-en').value.trim();
  const pn=prop==='p'?'Pistacchio by SnappyB':'SnappyB Living Spaces';
  const url=`${PROXY}?action=saveGuest&property=${encodeURIComponent(pn)}&name=${encodeURIComponent(g('f-nm').value.trim())}&city=${encodeURIComponent(g('f-ct').value.trim())}&zip=${encodeURIComponent(g('f-zp').value.trim())}&id=${encodeURIComponent(idV)}&phone=${encodeURIComponent(getFullPhone())}&checkin=${encodeURIComponent(ci)}&checkout=${encodeURIComponent(co)}`;
  fetch(url).catch(()=>{});
}

function buildMsg(){
  const T=TX[lang]||TX.el,isEl=lang==='el';
  const idV=isEl?g('f-el').value.trim():g('f-en').value.trim();
  const pn=prop==='p'?'Pistacchio by SnappyB':'SnappyB Living Spaces';
  return `${pn}\n\nName: ${g('f-nm').value.trim()}\nCity: ${g('f-ct').value.trim()}\nZIP: ${g('f-zp').value.trim()}\n${isEl?'ΑΦΜ':'ID/Passport'}: ${idV}\nPhone: ${getFullPhone()}\nCheck-in: ${ci}\nCheck-out: ${co}`;
}

function doWA(){
  const msg=buildMsg();lastMsg=msg;lastPlat='wa';
  g('wabtn').href=`whatsapp://send?phone=${WAN}&text=${encodeURIComponent(msg)}`;
  saveToSheet();
  showConf();return true;
}

function doBK(){
  const msg=buildMsg();lastMsg=msg;lastPlat='bk';
  saveToSheet();
  window._ctxt=msg;const T=TX[lang]||TX.el;
  t('cttl',T.bkt);g('cinstr').textContent=T.bki;
  g('cmsg').textContent=msg;t('cbtn',T.cpy);t('sntlbl',T.snt);
  g('sntbtn').style.display='none';g('cok').style.display='none';
  g('cbox').style.display='block';g('subcol').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}

function doCopy(){
  const txt=window._ctxt||'';
  const T=TX[lang]||TX.el;
  const ok=()=>{
    g('cok').textContent=T.cpyok;g('cok').style.display='block';
    g('sntbtn').style.display='block';t('sntlbl',T.snt);
    setTimeout(()=>g('cok').style.display='none',2500);
  };
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(ok).catch(()=>{fb(txt);ok();});}
  else{fb(txt);ok();}
}
function fb(tx){const a=document.createElement('textarea');a.value=tx;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);}

function showConf(){
  [1,2,3,4].forEach(i=>g('s'+i).classList.remove('active'));
  g('cbox').style.display='none';g('prog').style.display='none';
  g('scnf').classList.add('show');window.scrollTo({top:0,behavior:'smooth'});
}

function confSent(){
  g('scnf').classList.remove('show');
  const isP=prop==='p';
  g('lgp').style.display=isP?'block':'none';g('lgl').style.display=isP?'none':'block';
  g('sprop').textContent=isP?'PISTACCHIO BY SNAPPYB':'SNAPPYB LIVING SPACES';
  const T=TX[lang]||TX.el;
  t('stt',T.suc);t('stb',T.suct);t('smp',T.mp);t('smb',T.gm);t('snw',T.ns);
  g('smb').href=isP?'https://maps.app.goo.gl/9vXwUTiGjju6QWne6':'https://maps.app.goo.gl/BCgYSBm2Wi6stVvD9';
  g('ssuc').classList.add('show');window.scrollTo({top:0,behavior:'smooth'});
}

function confRetry(){
  g('scnf').classList.remove('show');g('prog').style.display='block';go(4);
  if(lastPlat==='bk'){window._ctxt=lastMsg;g('cbox').style.display='block';g('subcol').style.display='none';}
}

function resetAll(){
  prop='';ci='';co='';lastMsg='';lastPlat='';phCodeTouched=false;
  g('pp').classList.remove('on');g('pl').classList.remove('on');
  ['f-nm','f-ct','f-zp','f-el','f-en','f-ph'].forEach(id=>g(id).value='');
  ['ci-d','ci-m','ci-y','co-d','co-m'].forEach(id=>g(id).selectedIndex=0);
  ['e1','e2','e3','e4'].forEach(hideErr);
  g('cbox').style.display='none';g('subcol').style.display='flex';
  g('ssuc').classList.remove('show');g('scnf').classList.remove('show');
  g('prog').style.display='block';initDates();go(1);
}

function initDates(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();
  ['ci-d','co-d'].forEach(id=>{
    const s=g(id);s.innerHTML='<option value="">ΗΗ</option>';
    for(let i=1;i<=31;i++)s.innerHTML+=`<option value="${String(i).padStart(2,'0')}">${String(i).padStart(2,'0')}</option>`;
  });
  const ciy=g('ci-y');ciy.innerHTML='<option value="">ΕΕΕΕ</option>';
  for(let i=y;i<=y+1;i++)ciy.innerHTML+=`<option value="${i}">${i}</option>`;
  const coy=g('co-y');coy.innerHTML=`<option value="${y}">${y}</option>`;
  coy.value=String(y);
  updMonths();
  // Default = σήμερα
  g('ci-d').value=String(d).padStart(2,'0');
  g('ci-m').value=String(m).padStart(2,'0');
  g('ci-y').value=String(y);
  ci=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  // Φιλτράρισμα παρελθοντικών επιλογών
  updCiSelects();
}

// ✅ FIX: Απενεργοποίηση παρελθοντικών μηνών/ημερών στο check-in
function updCiSelects(){
  const now=new Date(),ty=now.getFullYear(),tm=now.getMonth()+1,td=now.getDate();
  const selY=g('ci-y').value,selM=g('ci-m').value;
  const curY=selY?parseInt(selY):ty;
  const curM=selM?parseInt(selM):tm;
  // Απενεργοποίηση παρελθοντικών μηνών αν είναι τρέχον έτος
  Array.from(g('ci-m').options).forEach(opt=>{
    if(!opt.value) return;
    const mo=parseInt(opt.value);
    opt.disabled=(curY===ty && mo<tm);
    if(opt.disabled && g('ci-m').value===opt.value){g('ci-m').value='';ci='';}
  });
  // Απενεργοποίηση παρελθοντικών ημερών αν είναι τρέχον έτος+μήνας
  Array.from(g('ci-d').options).forEach(opt=>{
    if(!opt.value) return;
    const dy=parseInt(opt.value);
    opt.disabled=(curY===ty && curM===tm && dy<td);
    if(opt.disabled && g('ci-d').value===opt.value){g('ci-d').value='';ci='';}
  });
}

function updMonths(){
  const months=MN[lang]||MN.en;
  ['ci-m','co-m'].forEach(id=>{
    const s=g(id);const cur=s.value;
    s.innerHTML='<option value="">ΜΜ</option>';
    months.forEach((nm,i)=>{const v=String(i+1).padStart(2,'0');s.innerHTML+=`<option value="${v}">${nm}</option>`;});
    if(cur)s.value=cur;
  });
}

// ✅ FIX: Ενημέρωση φίλτρου όταν αλλάζει επιλογή check-in
function bd(pre){
  const d=g(pre+'-d').value,m=g(pre+'-m').value,y=g(pre+'-y').value;
  const v=d&&m&&y?`${y}-${m}-${d}`:'';
  if(pre==='ci'){ci=v;updCiSelects();}else co=v;
}

lang=sessionStorage.getItem('sl')||'el';
initDates();setLang(lang);go(1);
</script>
